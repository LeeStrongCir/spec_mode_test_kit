[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
markers =
    integration: Integration tests (API contract, state machine, DB behavior)
    e2e: End-to-end tests (browser automation)
    lecs: LECS host management tests
    slow: Long-running tests (>10s)
