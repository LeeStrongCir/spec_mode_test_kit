<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LECS主机 - Lee云控制台</title>
    <link rel="stylesheet" href="/static/css/console.css">
    <link rel="stylesheet" href="/static/css/lecs-host-list.css">
</head>
<body>
    <div class="console-page">
        <header class="banner">
            <div class="logo">
                <span class="logo-icon"></span>
                Lee云
                <span style="margin: 0 8px; color: var(--lc-border-light);">|</span>
                <strong style="font-weight: 700; font-size: 15px; color: var(--lc-text-primary);">控制台</strong>
            </div>
            <div class="banner-links">
                <div class="user-info">
                    <a href="/profile">{{ user.username if user else 'admin' }}</a>
                    <span class="user-avatar">👤</span>
                </div>
            </div>
        </header>

        <main class="console-main lecs-list-main">
            <div class="lecs-page-header">
                <h1>LECS主机</h1>
                <a href="/console/lecs-hosts/create" class="btn btn-primary" data-testid="lecs-host-create-button">创建ECS主机</a>
            </div>

            <div class="lecs-table-container">
                <table class="lecs-data-table" data-testid="lecs-host-data-table">
                    <thead>
                        <tr>
                            <th>主机名称/ID</th>
                            <th>计费模式</th>
                            <th>运行状态</th>
                            <th>私有IP</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="lecsHostTableBody">
                        <tr id="lecs-loading-row">
                            <td colspan="5" class="text-center">加载中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="lecsEmptyState" class="lecs-empty-state" style="display:none;">
                    <div class="empty-icon">☁</div>
                    <p>暂无LECS主机</p>
                    <a href="/console/lecs-hosts/create" class="btn btn-primary btn-sm">创建ECS主机</a>
                </div>
            </div>

            <div class="lecs-pagination" id="lecsPagination" style="display:none;">
                <span class="pagination-info" id="lecsPaginationInfo"></span>
                <div class="pagination-controls">
                    <button class="btn btn-sm" id="lecsPrevPage" disabled>上一页</button>
                    <span id="lecsPageNumber">1</span>
                    <button class="btn btn-sm" id="lecsNextPage">下一页</button>
                </div>
            </div>
        </main>

        <footer class="page-footer">
            <span>©2026 Leecloud.com 版权所有</span>
            <div class="footer-links-group">
                <a href="/legal">法律声明</a>
                <a href="/privacy">隐私政策声明</a>
                <a href="/cookies">Cookies</a>
            </div>
        </footer>
    </div>

    <script src="/static/js/lecs-hosts.js"></script>
</body>
</html>
